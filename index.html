<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <title>Gujarati Formatter</title>

  <!-- Gujarati Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Serif Gujarati", serif;
      background: linear-gradient(180deg, #fff7ed, #fdebd3);
      color: #4a1c0d;
    }

    .container {
      max-width: 950px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header .jai {
      font-size: 28px;
      font-weight: 700;
      color: #8b1c1c;
      margin-bottom: 6px;
    }

    .header .subtitle {
      font-size: 15px;
      color: #7c2d12;
      opacity: 0.85;
    }

    .card {
      background: #fffaf3;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      padding: 26px;
      border-top: 6px solid #c2410c;
    }

    h2 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: #7c2d12;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.75;
      border-radius: 12px;
      border: 1px solid #e7c9a9;
      outline: none;
      background: #fffdf9;
    }

    textarea:focus {
      border-color: #c2410c;
      box-shadow: 0 0 0 3px rgba(194,65,12,0.2);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 26px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-format {
      background: linear-gradient(135deg, #c2410c, #9a3412);
      color: #fff;
    }

    .btn-format:hover {
      transform: translateY(-1px);
    }

    .btn-clear {
      background: #fef3c7;
      color: #7c2d12;
      border: 1px solid #f3d9b1;
    }

    .btn-copy {
      background: #065f46;
      color: #fff;
    }

    .btn-copy:hover {
      background: #047857;
    }

    .output {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px dashed #e7c9a9;
    }

    .title {
      margin: 20px 0 8px;
      font-weight: 700;
      font-size: 17px;
      color: #8b1c1c;
    }

    ul {
      margin: 0 0 16px 24px;
      padding: 0;
    }

    li {
      margin-bottom: 6px;
      line-height: 1.75;
    }

    li::marker {
      color: #c2410c;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 13px;
      color: #7c2d12;
      opacity: 0.75;
    }

    .copied {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #065f46;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="jai">🙏 જય શ્રી સ્વામિનારાયણ 🙏</div>
    <div class="subtitle">Gujarati Katha & Pravachan Formatter</div>
  </div>

  <div class="card">
    <h2>Gujarati Formatter</h2>

    <textarea id="input" placeholder="અહીં ગુજરાતી લખાણ પેસ્ટ કરો..."></textarea>

    <div class="actions">
      <button class="btn-format" onclick="formatGujarati()">Format</button>
      <button class="btn-copy" onclick="copyOutput()">Copy</button>
      <button class="btn-clear" onclick="clearAll()">Clear</button>
    </div>

    <div class="copied" id="copiedMsg">✅ Copied to clipboard</div>

    <div class="output" id="output"></div>

    <div class="footer">
      👉 શીર્ષક ઓળખ • વાક્ય પ્રમાણે બુલેટ • કથા માટે અનુકૂળ રચના
    </div>
  </div>

</div>

<script>
function formatGujarati() {
  const text = document.getElementById("input").value;
  const lines = text.split(/\n+/);
  const outputDiv = document.getElementById("output");
  outputDiv.innerHTML = "";

  lines.forEach((line, index) => {
    const trimmed = line.trim();
    if (!trimmed) return;

    const nextLine = lines[index + 1]?.trim() || "";

    const isTitle =
      trimmed.length <= 60 &&
      !/[।॥.]/.test(trimmed) &&
      nextLine.length > trimmed.length;

    if (isTitle) {
      const title = document.createElement("div");
      title.className = "title";
      title.innerText = "👉 " + trimmed;
      outputDiv.appendChild(title);
      return;
    }

    const sentences = trimmed.match(/[^।॥.]+[।॥.]*["”]?/g);
    if (!sentences) return;

    const ul = document.createElement("ul");

    sentences.forEach(sent => {
      sent = sent.trim();
      if (!sent) return;
      if (/^[।॥."”]+$/.test(sent)) return;
      if (/^\d+\.$/.test(sent)) return;

      const li = document.createElement("li");
      li.innerText = sent;
      ul.appendChild(li);
    });

    outputDiv.appendChild(ul);
  });
}

function copyOutput() {
  const output = document.getElementById("output");
  let textToCopy = "";

  output.childNodes.forEach(node => {
    if (node.classList && node.classList.contains("title")) {
      textToCopy += node.innerText + "\n";
    } else if (node.tagName === "UL") {
      node.querySelectorAll("li").forEach(li => {
        textToCopy += "• " + li.innerText + "\n";
      });
      textToCopy += "\n";
    }
  });

  navigator.clipboard.writeText(textToCopy.trim());

  const msg = document.getElementById("copiedMsg");
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 1500);
}

function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("output").innerHTML = "";
}
</script>

</body>
</html>
