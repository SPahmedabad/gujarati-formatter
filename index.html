<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <title>Gujarati Formatter</title>

  <!-- Gujarati Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Serif Gujarati", serif;
      background: linear-gradient(180deg, #fff7ed, #fdebd3);
      color: #4a1c0d;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .jai {
      font-size: 28px;
      font-weight: 700;
      color: #8b1c1c;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 4px;
    }

    .card {
      background: #fffaf3;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      padding: 26px;
      border-top: 6px solid #c2410c;
    }

    h2 {
      text-align: center;
      margin-bottom: 14px;
      color: #7c2d12;
    }

    textarea {
      width: 100%;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.8;
      border-radius: 12px;
      border: 1px solid #e7c9a9;
      background: #fffdf9;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #c2410c;
      box-shadow: 0 0 0 3px rgba(194,65,12,0.2);
    }

    #input {
      min-height: 240px;
    }

    #output {
      min-height: 520px; /* BIG output editor */
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 18px 0;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-main {
      background: linear-gradient(135deg, #c2410c, #9a3412);
      color: #fff;
    }

    .btn-copy {
      background: #065f46;
      color: #fff;
    }

    .btn-clear {
      background: #fef3c7;
      color: #7c2d12;
      border: 1px solid #f3d9b1;
    }

    .btn-copy:hover { background: #047857; }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      opacity: 0.75;
    }

    .copied {
      text-align: center;
      color: #065f46;
      font-size: 14px;
      display: none;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="header">
    <div class="jai">🙏 જય શ્રી સ્વામિનારાયણ 🙏</div>
    <div class="subtitle">Gujarati Katha & Pravachan Formatter</div>
  </div>

  <div class="card">
    <h2>Input Text</h2>
    <textarea id="input" placeholder="અહીં કાચું ગુજરાતી લખાણ પેસ્ટ કરો..."></textarea>

    <div class="actions">
      <button class="btn-main" onclick="formatGujarati()">Format ↓</button>
      <button class="btn-clear" onclick="clearAll()">Clear</button>
    </div>

    <h2>Formatted Editable Output</h2>
    <textarea id="output" placeholder="અહીં ફોર્મેટ થયેલું લખાણ આવશે (તમે edit કરી શકો છો)..."></textarea>

    <div class="actions">
      <button class="btn-copy" onclick="copyFormatted()">Copy Formatted Text</button>
    </div>

    <div class="copied" id="copiedMsg">✅ Copied to clipboard</div>

    <div class="footer">
      👉 મોટા ગ્રંથ માટે યોગ્ય • Editable Output • Copy after edit
    </div>
  </div>
</div>

<script>
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + 4 + "px";
}

function formatGujarati() {
  const input = document.getElementById("input").value;
  const lines = input.split(/\n+/);
  let result = "";

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    const next = lines[i + 1]?.trim() || "";

    const isTitle =
      line.length <= 60 &&
      !/[।॥.]/.test(line) &&
      next.length > line.length;

    if (isTitle) {
      result += "👉 " + line + "\n\n";
      continue;
    }

    const sentences = line.match(/[^।॥.]+[।॥.]*["”]?/g);
    if (!sentences) continue;

    sentences.forEach(s => {
      s = s.trim();
      if (!s) return;
      result += "• " + s + "\n";
    });

    result += "\n";
  }

  const output = document.getElementById("output");
  output.value = result.trim();
  autoGrow(output);
}

function copyFormatted() {
  const out = document.getElementById("output");
  out.select();
  document.execCommand("copy");

  const msg = document.getElementById("copiedMsg");
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 1500);
}

function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("output").value = "";
}
</script>

</body>
</html>
